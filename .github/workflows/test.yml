name: Package and render
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg build-essential python3-dev pkg-config libcairo2-dev libpango1.0-dev
      - name: Install locked environment
        run: |
          python -m pip install uv
          uv sync --locked
      - name: Test and render
        env:
          OPENMOTION_RUN_RENDER_TESTS: '1'
        run: |
          uv run openmotion doctor
          uv run pytest
          uv build
